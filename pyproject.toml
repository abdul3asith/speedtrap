[project]
name = "paper-vla"
version = "0.1.0"
description = "Speed and certified success benchmarks for VLAs"
requires-python = ">=3.12,<3.13"
dependencies = [
    "lerobot[smolvla]",
    "matplotlib>=3.11.2",
    "modal>=1.6.4",
    "torchao>=0.18.0",
]

[project.scripts]
onset = "benchmarks.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["benchmarks"]

[tool.uv.sources]
lerobot = { git = "https://github.com/huggingface/lerobot.git", rev = "b00571809f7cab69abeee19744d8dd3c18977aa2" }

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "ruff>=0.17.6",
]
